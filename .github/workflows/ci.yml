# Nombre del flujo de trabajo
name: Flutter CI

# Define cuando se debe ejecutar
on:
  push:
    branches: [ main, master ] # Anadimos master por si acaso
  pull_request:
    branches: [ main, master ]

# Define los trabajos a ejecutar
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Clona tu repositorio
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Configura Java
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'gradle'
          
      # 3. Configura Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Instala las dependencias
      - name: Install dependencies
        run: flutter pub get

      # 5. Ejecuta el analisis estatico
      - name: Run static analysis
        run: flutter analyze

      # --- NUEVO PASO AÑADIDO ---
      # 6. Genera los archivos necesarios para las pruebas
      - name: Generate mock files
        run: dart run build_runner build --delete-conflicting-outputs
      # ---------------------------

      # 7. Ejecuta las pruebas unitarias
      - name: Run tests
        run: flutter test

      # 8. Compila la aplicacion para Android
      - name: Build APK
        run: flutter build apk --debug