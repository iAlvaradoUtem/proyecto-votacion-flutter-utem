# Nombre del flujo de trabajo que aparecerá en la pestaña "Actions" de GitHub
name: Flutter CI

# Define cuándo se debe ejecutar este flujo de trabajo
on:
  # Se ejecuta cada vez que haces un "push" a la rama principal (main)
  push:
    branches: [ main ]
  # También se ejecuta cuando haces un "pull request" a la rama principal
  pull_request:
    branches: [ main ]

# Define los trabajos que se van a ejecutar
jobs:
  # Solo tenemos un trabajo, que llamaremos "build"
  build:
    # El tipo de máquina virtual en la que se ejecutará el trabajo
    runs-on: ubuntu-latest

    # Los pasos que componen el trabajo
    steps:
      # 1. Clona tu repositorio en la máquina virtual
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Configura el entorno de Java, necesario para Android
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'gradle'
          
      # 3. Configura el entorno de Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x' # Puedes especificar tu versión de Flutter si quieres
          channel: 'stable'
          cache: true

      # 4. Instala las dependencias del proyecto
      - name: Install dependencies
        run: flutter pub get

      # 5. Ejecuta el análisis estático del código
      - name: Run static analysis
        run: flutter analyze

      # 6. Ejecuta las pruebas unitarias
      - name: Run tests
        run: flutter test

      # 7. Compila la aplicación en modo debug para Android
      - name: Build APK
        run: flutter build apk --debug